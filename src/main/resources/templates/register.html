<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Placement Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="register-container">
        <div class="card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="color: #667eea; margin-bottom: 0.5rem;">🎓 Placement Portal</h2>
                <h3 style="color: #333; font-weight: 600;">Join Our Community</h3>
                <p style="color: #666; margin-top: 0.5rem;">Create your account to get started</p>
            </div>
            
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <form method="post" action="/register" th:object="${user}">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="Enter your email address" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Create a strong password" required>
                </div>
                <div class="form-group">
                    <label for="role">I am a</label>
                    <select id="role" th:field="*{role}" required>
                        <option value="">Select your role</option>
                        <option value="STUDENT">Student looking for opportunities</option>
                        <option value="COMPANY">Company seeking talent</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 600;">Create Account</button>
            </form>
            
            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0;">
                <p style="color: #666; margin-bottom: 0.5rem;">Already have an account?</p>
                <a href="/login" style="color: #667eea; text-decoration: none; font-weight: 600;">Sign in here →</a>
            </div>
        </div>
    </div>
</body>
</html>
