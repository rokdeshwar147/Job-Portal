<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Placement Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="color: #667eea; margin-bottom: 0.5rem;">🎓 Placement Portal</h2>
                <h3 style="color: #333; font-weight: 600;">Welcome Back</h3>
                <p style="color: #666; margin-top: 0.5rem;">Sign in to access your account</p>
            </div>
            
            <form method="post" action="/login">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 600;">Sign In</button>
            </form>
            
            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0;">
                <p style="color: #666; margin-bottom: 0.5rem;">New to Placement Portal?</p>
                <a href="/register" style="color: #667eea; text-decoration: none; font-weight: 600;">Create your account →</a>
            </div>
        </div>
    </div>
</body>
</html>
